<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Plock Optimizer v9</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; max-width: 1100px; margin:auto; background:#fafafa; }
.section { margin-top:20px; }
.card { background:white; padding:10px; border:1px solid #ddd; margin-top:10px; }
input { width:90px; }
</style>
</head>

<body>

<h2>Plock Optimizer v9</h2>

<div class="section">
<h3>⏰ Nuvarande tid</h3>
<div id="clock"></div>
</div>

<div class="section">
<h3>Antal kvar</h3>
3m: <input id="a3" value="200"><br>
6m: <input id="a6" value="200"><br>
S: <input id="aS" value="100">
</div>

<div class="section">
<h3>📦 Kommande inflöde (total för dagen)</h3>
<input id="incoming" value="300">
<p>Fördelning av inflöde:</p>
<ul>
<li>3m: 40%</li>
<li>6m: 58%</li>
<li>S: 1%</li>
</ul>
</div>

<div class="section">
<h3>⚙ RT (rate per station)</h3>
3m: <input id="s3" value="20"><br>
6m: <input id="s6" value="15"><br>
S: <input id="sS" value="25">
</div>

<div class="section">
<h3>👥 Total bemanning (max 8)</h3>
<input id="staff" value="6">
</div>

<div class="section">
<h3>🎯 Sluttid</h3>
<input id="goal" type="time" value="23:00">
</div>

<hr>

<h3>📊 Rekommenderad bemanning</h3>
<div id="rec"></div>

<h3>📌 Status</h3>
<div id="status"></div>

<h3>📈 Prognosgraf (hela dagen)</h3>
<canvas id="chart"></canvas>

<script>

// ---------- CLOCK ----------
function updateClock(){
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
}

// ---------- OPTIMIZATION ----------
function optimize(){

  let total = +staff.value;
  let best = null;
  let bestScore = 1e9;

  for (let b3=0;b3<=total;b3++){
    for (let b6=0;b6<=total-b3;b6++){
      let bS = total - b3 - b6;

      let score = simulate(b3,b6,bS);

      if (score < bestScore){
        bestScore = score;
        best = {b3,b6,bS};
      }
    }
  }

  return best;
}

// ---------- SIM ----------
function simulate(b3,b6,bS){

  let a3 = +a3El.value;
  let a6 = +a6El.value;
  let aS = +aSEl.value;

  let s3 = +s3El.value;
  let s6 = +s6El.value;
  let sS = +sSEl.value;

  let goal = new Date("2020-01-01T"+goalEl.value);
  let now = new Date("2020-01-01T08:00");

  let hours = (goal-now)/3600000;
  let step = 0.1;

  let penalty = 0;

  let in3 = (+incomingEl.value*0.40)/hours;
  let in6 = (+incomingEl.value*0.58)/hours;
  let inS = (+incomingEl.value*0.01)/hours;

  for (let t=0;t<hours;t+=step){

    a3 += in3*step - b3*s3*step;
    a6 += in6*step - b6*s6*step;
    aS += inS*step - bS*sS*step;

    if (a3<0) penalty += 5;
    if (a6<0) penalty += 5;
    if (aS<0) penalty += 5;
  }

  return penalty;
}

// ---------- GRAPH ----------
let chart;

function draw(best){

  let a3 = +a3El.value;
  let a6 = +a6El.value;
  let aS = +aSEl.value;

  let s3 = +s3El.value;
  let s6 = +s6El.value;
  let sS = +sSEl.value;

  let goal = new Date("2020-01-01T"+goalEl.value);
  let now = new Date("2020-01-01T08:00");

  let hours = (goal-now)/3600000;
  let step = 0.1;

  let labels=[], d3=[], d6=[], dS=[];

  let in3 = (+incomingEl.value*0.40)/hours;
  let in6 = (+incomingEl.value*0.58)/hours;
  let inS = (+incomingEl.value*0.01)/hours;

  for (let t=0;t<hours;t+=step){

    a3 += in3*step - best.b3*s3*step;
    a6 += in6*step - best.b6*s6*step;
    aS += inS*step - best.bS*sS*step;

    labels.push(t.toFixed(1));
    d3.push(a3);
    d6.push(a6);
    dS.push(aS);
  }

  if (chart) chart.destroy();

  chart = new Chart(chartEl,{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'3m',data:d3},
        {label:'6m',data:d6},
        {label:'S',data:dS}
      ]
    }
  });
}

// ---------- UI ----------
function render(){

  let best = optimize();

  rec.innerHTML =
    `3m: ${best.b3} | 6m: ${best.b6} | S: ${best.bS}`;

  status.innerHTML =
    `<div class="card">System optimerat</div>`;

  draw(best);
}

// ---------- LOOP ----------
setInterval(()=>{
  updateClock();
  render();
}, 5000);

// ---------- ELEMENTS ----------
const a3El=document.getElementById("a3");
const a6El=document.getElementById("a6");
const aSEl=document.getElementById("aS");

const s3El=document.getElementById("s3");
const s6El=document.getElementById("s6");
const sSEl=document.getElementById("sS");

const staff=document.getElementById("staff");
const goalEl=document.getElementById("goal");
const incomingEl=document.getElementById("incoming");

const rec=document.getElementById("rec");
const status=document.getElementById("status");
const chartEl=document.getElementById("chart");

render();

</script>

</body>
</html>
