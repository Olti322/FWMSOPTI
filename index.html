<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Plock Control v13</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; background:#f4f6f8; max-width:1200px; margin:auto; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.card { background:white; padding:12px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.1); margin-top:10px; }
input { width:90px; }
.top { display:flex; justify-content:space-between; padding:10px; background:white; border-radius:8px; }
.good { color:green; font-weight:bold; }
.warn { color:orange; font-weight:bold; }
.bad { color:red; font-weight:bold; }
</style>
</head>

<body>

<h2>Plock Control v13 – Risk & Decision Engine</h2>

<div class="top">
<div>⏰ Nu: <input id="now" type="time" value="20:00"></div>
<div>🎯 Slut: <input id="goal" type="time" value="23:00"></div>
</div>

<div class="grid">

<div class="card">
<h3>📦 Lägesbild</h3>
3m <input id="a3" value="200"><br>
6m <input id="a6" value="200"><br>
S <input id="aS" value="100"><br><br>

Inflöde <input id="in" value="0"><br>
</div>

<div class="card">
<h3>⚙ RT</h3>
3m <input id="r3" value="14"><br>
6m <input id="r6" value="10"><br>
S <input id="rS" value="8"><br><br>

<h3>👥 Bemanning</h3>
3m <input id="b3" value="1"><br>
6m <input id="b6" value="1"><br>
S <input id="bS" value="0"><br>
</div>

</div>

<div class="card">
<h3>🧠 AI Rekommendation</h3>
<div id="rec"></div>
</div>

<div class="card">
<h3>⚠ Status (tid till problem)</h3>
<div id="status"></div>
</div>

<div class="card">
<h3>📈 Prognos</h3>
<canvas id="chart"></canvas>
</div>

<script>

// ---------- TIME ----------
function t(x){ let [h,m]=x.split(":").map(Number); return h+m/60; }

// ---------- CORE SIM ----------
function simulate(b3,b6,bS){

  let start=t(now.value);
  let end=t(goal.value);
  let hours=end-start;

  let a3=+a3.value;
  let a6=+a6.value;
  let aS=+aS.value;

  let r3=+r3.value;
  let r6=+r6.value;
  let rS=+rS.value;

  let risk=0;
  let breakdownTime=999;

  let step=0.1;

  for(let i=0;i<hours;i+=step){

    let cur=start+i;

    let production =
      b3*r3 + b6*r6 + bS*rS;

    let demand =
      (a3+a6+aS)/hours;

    let net = production - demand;

    a3 -= net*step;
    a6 -= net*step;
    aS -= net*step;

    if(a3<0 || a6<0 || aS<0){
      if(breakdownTime===999) breakdownTime=cur;
      risk++;
    }
  }

  return {risk, breakdownTime};
}

// ---------- OPTIMIZER ----------
function optimize(){

  let total = +b3.value + +b6.value + +bS.value;

  let best=null;
  let bestRisk=1e9;

  for(let x=0;x<=total;x++){
    for(let y=0;y<=total-x;y++){
      let z=total-x-y;

      let sim = simulate(x,y,z);

      if(sim.risk < bestRisk){
        bestRisk = sim.risk;
        best = {b3:x,b6:y,bS:z, sim};
      }
    }
  }

  return best;
}

// ---------- STATUS ENGINE ----------
function getStatus(best){

  let sim = best.sim;

  if(sim.breakdownTime < 999){

    return `<div class="bad">
❌ Kritisk risk<br>
Första problem ca: <b>${sim.breakdownTime.toFixed(1)}h</b><br><br>
👉 Systemet kommer inte hålla kapacitet hela perioden
</div>`;
  }

  return `<div class="good">
✔ Stabil drift hela perioden
</div>`;
}

// ---------- RECOMMENDATION ----------
function getRec(best){

  let total = +b3.value + +b6.value + +bS.value;

  let currentCap =
    best.b3*r3.value +
    best.b6*r6.value +
    best.bS*rS.value;

  let target =
    (+a3.value + +a6.value + +aS.value) /
    (t(goal.value)-t(now.value));

  let gap = target - currentCap;

  return `
  Rekommenderad bemanning: ${best.b3}/${best.b6}/${best.bS}<br><br>

  Kapacitetsgap: <b>${gap.toFixed(1)}</b><br><br>

  ${gap>0 ?
    "👉 Öka RT eller lägg till bemanning" :
    "👉 Överkapacitet – kan omfördela"}
  `;
}

// ---------- GRAPH ----------
let chart;

function draw(best){

  let start=t(now.value);
  let end=t(goal.value);
  let hours=end-start;

  let a3=+a3.value;
  let a6=+a6.value;
  let aS=+aS.value;

  let r3=+r3.value;
  let r6=+r6.value;
  let rS=+rS.value;

  let labels=[], d3=[], d6=[], dS=[];

  let step=0.1;

  for(let i=0;i<hours;i+=step){

    let cur=start+i;

    let production =
      best.b3*r3 +
      best.b6*r6 +
      best.bS*rS;

    let demand=(a3+a6+aS)/hours;

    let net=production-demand;

    a3-=net*step;
    a6-=net*step;
    aS-=net*step;

    labels.push(`${Math.floor(cur)}:00`);
    d3.push(a3);
    d6.push(a6);
    dS.push(aS);
  }

  if(chart) chart.destroy();

  chart=new Chart(chartEl,{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"3m",data:d3,borderColor:"blue"},
        {label:"6m",data:d6,borderColor:"green"},
        {label:"S",data:dS,borderColor:"orange"}
      ]
    }
  });
}

// ---------- RENDER ----------
function render(){

  let best = optimize();

  rec.innerHTML = getRec(best);
  status.innerHTML = getStatus(best);

  draw(best);
}

setInterval(render,10000);
render();

// ---------- DOM ----------
const now=document.getElementById("now");
const goal=document.getElementById("goal");

const a3=document.getElementById("a3");
const a6=document.getElementById("a6");
const aS=document.getElementById("aS");

const in=document.getElementById("in");

const r3=document.getElementById("r3");
const r6=document.getElementById("r6");
const rS=document.getElementById("rS");

const b3=document.getElementById("b3");
const b6=document.getElementById("b6");
const bS=document.getElementById("bS");

const chartEl=document.getElementById("chart");
const rec=document.getElementById("rec");
const status=document.getElementById("status");

</script>

</body>
</html>
