<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Plock Control v16</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(180deg, #d9f0ff, #f4f6f8);
  max-width:1200px;
  margin:auto;
}

.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

.card {
  background:white;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
}

.top {
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:white;
  border-radius:8px;
  margin-top:10px;
}

input { width:90px; }

.good { color:green; font-weight:bold; }
.bad { color:red; font-weight:bold; }
</style>
</head>

<body>

<h2>Plock Control v16 – Stabil engine</h2>

<div class="top">
<div>⏰ Nu: <input id="now" type="time" value="20:00"></div>
<div>🎯 Slut: <input id="goal" type="time" value="23:00"></div>
</div>

<div class="grid">

<div class="card">
<h3>📦 Lägesbild</h3>
3m <input id="a3" value="200"><br>
6m <input id="a6" value="200"><br>
S <input id="aS" value="100">
</div>

<div class="card">
<h3>⚙ RT</h3>
3m <input id="r3" value="14"><br>
6m <input id="r6" value="10"><br>
S <input id="rS" value="8">

<h3>👥 Bemanning</h3>
3m <input id="b3" value="1"><br>
6m <input id="b6" value="1"><br>
S <input id="bS" value="0">
</div>

</div>

<div class="card">
<h3>🧠 AI</h3>
<div id="rec"></div>
</div>

<div class="card">
<h3>⚠ Status</h3>
<div id="status"></div>
</div>

<div class="card">
<h3>📈 Prognos</h3>
<canvas id="chart"></canvas>
</div>

<script>

let chart;

// ---------- TIME ----------
function t(x){
  let [h,m]=x.split(":").map(Number);
  return h + m/60;
}

// ---------- SNAPSHOT ----------
function getData(){
  return {
    a3: Number(a3.value),
    a6: Number(a6.value),
    aS: Number(aS.value),
    r3: Number(r3.value),
    r6: Number(r6.value),
    rS: Number(rS.value),
    b3: Number(b3.value),
    b6: Number(b6.value),
    bS: Number(bS.value)
  };
}

// ---------- SIM ----------
function simulate(data){

  let start = t(now.value);
  let end = t(goal.value);
  let hours = Math.max(0.1, end-start);

  let a3=data.a3, a6=data.a6, aS=data.aS;

  let risk = 0;
  let breakdown = null;

  let step = 0.1;

  for(let i=0;i<hours;i+=step){

    let production =
      data.b3*data.r3 +
      data.b6*data.r6 +
      data.bS*data.rS;

    let demand = (data.a3+data.a6+data.aS)/hours;

    let net = production - demand;

    a3 -= net*step;
    a6 -= net*step;
    aS -= net*step;

    if(a3<0 || a6<0 || aS<0){
      risk++;
      if(!breakdown) breakdown = start+i;
    }
  }

  return {risk, breakdown};
}

// ---------- OPT ----------
function optimize(data){

  let total = data.b3+data.b6+data.bS;

  let best=null, bestRisk=1e9;

  for(let x=0;x<=total;x++){
    for(let y=0;y<=total-x;y++){
      let z=total-x-y;

      let sim = simulate({
        ...data,
        b3:x,b6:y,bS:z
      });

      if(sim.risk < bestRisk){
        bestRisk = sim.risk;
        best = {b3:x,b6:y,bS:z, sim};
      }
    }
  }

  return best;
}

// ---------- UI ----------
function render(){

  const data = getData();
  const best = optimize(data);

  rec.innerHTML =
    best.sim.breakdown
      ? "❌ Risk för problem"
      : "✔ Stabil drift";

  status.innerHTML =
    best.sim.breakdown
      ? `❌ Problem ca ${best.sim.breakdown.toFixed(1)}h`
      : "✔ OK";

  draw(best, data);
}

// ---------- GRAPH ----------
function draw(best,data){

  let start = t(now.value);
  let end = t(goal.value);
  let hours = Math.max(0.1,end-start);

  let a3=data.a3, a6=data.a6, aS=data.aS;

  let labels=[], d3=[], d6=[], dS=[];

  let step=0.1;

  for(let i=0;i<hours;i+=step){

    let production =
      best.b3*data.r3 +
      best.b6*data.r6 +
      best.bS*data.rS;

    let demand = (data.a3+data.a6+data.aS)/hours;

    let net = production-demand;

    a3-=net*step;
    a6-=net*step;
    aS-=net*step;

    labels.push(Math.floor(start+i)+":00");
    d3.push(Math.max(0,a3));
    d6.push(Math.max(0,a6));
    dS.push(Math.max(0,aS));
  }

  if(chart) chart.destroy();

  chart = new Chart(chartEl,{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"3m",data:d3,borderColor:"blue"},
        {label:"6m",data:d6,borderColor:"green"},
        {label:"S",data:dS,borderColor:"orange"}
      ]
    }
  });
}

setInterval(render,2000);
render();

const a3=document.getElementById("a3");
const a6=document.getElementById("a6");
const aS=document.getElementById("aS");

const r3=document.getElementById("r3");
const r6=document.getElementById("r6");
const rS=document.getElementById("rS");

const b3=document.getElementById("b3");
const b6=document.getElementById("b6");
const bS=document.getElementById("bS");

const rec=document.getElementById("rec");
const status=document.getElementById("status");
const chartEl=document.getElementById("chart");

</script>

</body>
</html>
