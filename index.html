<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Plock Control v15</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(180deg, #d9f0ff, #f4f6f8);
  max-width:1200px;
  margin:auto;
}

h2 { margin-top: 10px; }

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card {
  background:white;
  padding:12px;
  border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
  margin-top:10px;
}

.top {
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:white;
  border-radius:8px;
  margin-top:10px;
}

input { width:90px; }

.good { color:green; font-weight:bold; }
.bad { color:red; font-weight:bold; }
</style>
</head>

<body>

<h2>Plock Control v15 – Stabil beslutsmotor</h2>

<div class="top">
<div>⏰ Nu: <input id="now" type="time" value="20:00"></div>
<div>🎯 Slut: <input id="goal" type="time" value="23:00"></div>
</div>

<div class="grid">

<div class="card">
<h3>📦 Lägesbild</h3>
3m <input id="a3" value="200"><br>
6m <input id="a6" value="200"><br>
S <input id="aS" value="100"><br><br>

Inflöde <input id="inflow" value="0">
</div>

<div class="card">
<h3>⚙ RT per person</h3>
3m <input id="r3" value="14"><br>
6m <input id="r6" value="10"><br>
S <input id="rS" value="8"><br><br>

<h3>👥 Bemanning</h3>
3m <input id="b3" value="1"><br>
6m <input id="b6" value="1"><br>
S <input id="bS" value="0"><br>
</div>

</div>

<div class="card">
<h3>Rekommendation</h3>
<div id="rec"></div>
</div>

<div class="card">
<h3>⚠ Status</h3>
<div id="status"></div>
</div>

<div class="card">
<h3>📈 Prognos</h3>
<canvas id="chart"></canvas>
</div>

<script>

let chart;

// ---------- TIME ----------
function t(x){
  let [h,m] = x.split(":").map(Number);
  return h + m/60;
}

// ---------- SIMULATION ----------
function simulate(b3,b6,bS){

  let start = t(now.value);
  let end = t(goal.value);
  let hours = Math.max(0.1, end - start);

  let a3 = Number(a3El.value || 0);
  let a6 = Number(a6El.value || 0);
  let aS = Number(aSEl.value || 0);

  let r3 = Number(r3El.value || 0);
  let r6 = Number(r6El.value || 0);
  let rS = Number(rSEl.value || 0);

  let risk = 0;
  let breakdown = null;

  let step = 0.1;

  for(let i=0;i<hours;i+=step){

    let production =
      b3*r3 + b6*r6 + bS*rS;

    let demand =
      (Number(a3El.value) +
       Number(a6El.value) +
       Number(aSEl.value)) / hours;

    let net = production - demand;

    a3 -= net*step;
    a6 -= net*step;
    aS -= net*step;

    if(a3 < 0 || a6 < 0 || aS < 0){
      risk++;
      if(!breakdown) breakdown = start + i;
    }
  }

  return {risk, breakdown};
}

// ---------- OPTIMIZER ----------
function optimize(){

  let total =
    Number(b3El.value) +
    Number(b6El.value) +
    Number(bSEl.value);

  let best = null;
  let bestRisk = Infinity;

  for(let x=0;x<=total;x++){
    for(let y=0;y<=total-x;y++){
      let z = total - x - y;

      let sim = simulate(x,y,z);

      if(sim.risk < bestRisk){
        bestRisk = sim.risk;
        best = {b3:x,b6:y,bS:z, sim};
      }
    }
  }

  return best;
}

// ---------- STATUS ----------
function getStatus(best){

  if(!best || !best.sim){
    return "<div class='bad'>❌ Ingen data</div>";
  }

  if(best.sim.breakdown){
    return `<div class='bad'>
❌ Risk för kapacitetsbrist<br>
Tid till problem: <b>${best.sim.breakdown.toFixed(1)}h</b>
</div>`;
  }

  return "<div class='good'>✔ Stabil drift hela perioden</div>";
}

// ---------- AI ----------
function getRec(best){

  if(!best) return "❌ Ingen optimering";

  let cap =
    best.b3*(Number(r3El.value)) +
    best.b6*(Number(r6El.value)) +
    best.bS*(Number(rSEl.value));

  let demand =
    (Number(a3El.value) +
     Number(a6El.value) +
     Number(aSEl.value)) /
    Math.max(0.1, (t(goal.value)-t(now.value)));

  let gap = demand - cap;

  if(Math.abs(gap) < 0.5){
    return "✔ Balans mellan kapacitet och behov";
  }

  if(gap > 0){
    return `❌ Underskott: ${gap.toFixed(1)} rader/timme<br>
👉 Öka bemanning eller RT`;
  }

  return `✔ Överkapacitet: ${Math.abs(gap).toFixed(1)}<br>
👉 Omfördela resurser`;
}

// ---------- GRAPH ----------
function draw(best){

  if(!best) return;

  let start = t(now.value);
  let end = t(goal.value);
  let hours = Math.max(0.1, end-start);

  let a3 = Number(a3El.value || 0);
  let a6 = Number(a6El.value || 0);
  let aS = Number(aSEl.value || 0);

  let r3 = Number(r3El.value || 0);
  let r6 = Number(r6El.value || 0);
  let rS = Number(rSEl.value || 0);

  let step = 0.1;

  let labels=[], d3=[], d6=[], dS=[];

  for(let i=0;i<hours;i+=step){

    let cur = start + i;

    let production =
      best.b3*r3 + best.b6*r6 + best.bS*rS;

    let demand =
      (Number(a3El.value)+Number(a6El.value)+Number(aSEl.value))/hours;

    let net = production - demand;

    a3 -= net*step;
    a6 -= net*step;
    aS -= net*step;

    labels.push(Math.floor(cur)+":00");
    d3.push(Math.max(0,a3));
    d6.push(Math.max(0,a6));
    dS.push(Math.max(0,aS));
  }

  if(chart) chart.destroy();

  chart = new Chart(chartEl,{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"3m",data:d3,borderColor:"blue"},
        {label:"6m",data:d6,borderColor:"green"},
        {label:"S",data:dS,borderColor:"orange"}
      ]
    },
    options:{
      responsive:true
    }
  });
}

// ---------- RENDER ----------
function render(){

  let best = optimize();

  recEl.innerHTML = getRec(best);
  statusEl.innerHTML = getStatus(best);

  draw(best);
}

setInterval(render,10000);
render();

// ---------- ELEMENTS ----------
const now = document.getElementById("now");
const goal = document.getElementById("goal");

const a3El = document.getElementById("a3");
const a6El = document.getElementById("a6");
const aSEl = document.getElementById("aS");

const r3El = document.getElementById("r3");
const r6El = document.getElementById("r6");
const rSEl = document.getElementById("rS");

const b3El = document.getElementById("b3");
const b6El = document.getElementById("b6");
const bSEl = document.getElementById("bS");

const recEl = document.getElementById("rec");
const statusEl = document.getElementById("status");
const chartEl = document.getElementById("chart");

</script>

</body>
</html>
